{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/stats.css') }}">

<!-- Course selection tabs -->
{{ course_tabs|safe }}

<h3 class="py-3">Summary</h3>
<div class="tab-content" id="myTabContent">
    <div class="tab-pane fade show active" id="course-0" role="tabpanel" aria-labelledby="course-0-tab">
        {{ summaries[0]|safe }}
        {{ details[0]|safe }}
    </div>
    {% for i in range(1, summaries|count) %}
    <div class="tab-pane fade" id="course-{{ i }}" role="tabpanel" aria-labelledby="course-{{ i }}-tab">
        {{ summaries[i]|safe }}
        {{ details[i]|safe }}
    </div>
    {% endfor %}
</div>

<script src="{{ url_for('static', filename='js/stats/course.js') }}"></script>

{% endblock %}
