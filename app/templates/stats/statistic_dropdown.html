<div class="dropdown" style="padding-left: 1px; padding-right: 1px;">
    <span class="label-above">Statistic</span>
    <button class="btn btn-success dropdown-toggle filter-button" type="button" data-bs-toggle="dropdown" aria-expanded="false"
        id="statistic-dropdown" data-key="{{ statistic or (statistics_dict.keys()|list)[0]}}">
        {{ statistics_dict[statistic]['label'] if statistic else (statistics_dict.values()|list)[0]['label'] }}
    </button>
    <ul class="dropdown-menu">
        {% for k,v in statistics_dict.items() %}
        {% set label = v['label'] %}
        <li><a class="dropdown-item" onclick="setStatisticDropdown('{{ k }}', '{{ label }}')">{{ label }}</a></li>
        {% endfor %}
    </ul>
</div>
