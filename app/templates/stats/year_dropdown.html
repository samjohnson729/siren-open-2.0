<div class="dropdown" style="padding-left: 1px; padding-right: 1px;">
    <span class="label-above">Year</span>
    <button class="btn btn-success dropdown-toggle filter-button" type="button" data-bs-toggle="dropdown" aria-expanded="false"
        id="year-dropdown" data-key="{{ year or ''}}">
        {{ year or 'All' }}
    </button>
    <ul class="dropdown-menu">
        <li><a class="dropdown-item" onclick="setYearDropdown('all')">All</a></li>
        {% for y in years %}
        <li><a class="dropdown-item" onclick="setYearDropdown('{{ y }}')">{{ y }}</a></li>
        {% endfor %}
    </ul>
</div>
