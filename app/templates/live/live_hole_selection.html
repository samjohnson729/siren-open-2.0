<!-- scrolling hole numbers at the bottom of the screen -->
<div id="live-hole-selection" class="fixed-bottom-div">
    {% for i in range(num_holes) %}
    <a type="button" class="btn btn-success mx-0" style="width: 23%"
        href="{{ url_for('live_detail', course=course, hole=i+1) }}">{{ i+1 }}</a>
    {% endfor %}
</div>
