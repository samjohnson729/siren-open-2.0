<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Siren Open{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='/media/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" crossorigin="anonymous">
</head>

<body>

    <nav id="base-navbar" class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/home" style="font-size: 3rem;">Siren Open</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fs-1 text-light" href="/live">Live</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle fs-1 text-light" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Stats
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item fs-3" href="/stats/leaderboard">Leaderboard</a></li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item fs-3" href="/stats/scorecard">Scorecards</a></li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item fs-3" href="/stats/breakdown">Breakdown</a></li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item fs-3" href="/stats/golfer">Golfers</a></li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item fs-3" href="/stats/course">Courses</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-1 text-light" href="/media">Media</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Your page content will go here -->
        {% endblock %}
    </div>
</body>

<footer>
</footer>

</html>
