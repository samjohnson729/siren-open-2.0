services:
  siren-open:
    build: .
    container_name: siren-open
    volumes:
      - .:/app
    ports:
      - 5000:5000
    environment:
      - FLASK_APP=main.py
    command: flask run --host=0.0.0.0
    #command: gunicorn -w 3 -t 60 -b 0.0.0.0:5000 main:app

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf